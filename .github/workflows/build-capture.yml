name: Build Capture Helper

on:
  push:
    branches:
      - integration/engine-v0.3
  pull_request:
    branches:
      - integration/engine-v0.3
  workflow_dispatch:

jobs:
  build-capture:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build Capture helper
        run: dotnet build Capture.csproj --configuration Release

      - name: Upload Capture helper
        uses: actions/upload-artifact@v4
        with:
          name: STD-AIO-Capture
          path: bin/Release/net8.0-windows10.0.19041.0/
          if-no-files-found: error

  check-python-vision:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Python syntax
        run: python -m py_compile vision/vision_worker.py
